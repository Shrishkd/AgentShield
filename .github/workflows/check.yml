name: AgentShield checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: npm --prefix frontend ci && npm --prefix frontend run build
      - run: python -m pytest -q
      - run: python -m examples.week1 && python -m examples.week6
      - run: python -m evals.benchmark --trials 1
      - name: Check benchmark execution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path(".agentshield/week8.json").read_text())
          assert result["summary"]["batch_acceptance"]["count"] == result["cases"] == 100
          assert result["summary"]["modes"]["graph"]["investigations"] > 0
          assert result["replay"]["verified"]["count"] == 2
          PY
      - name: Start the packaged collector and exercise its API
        run: |
          export AGENTSHIELD_ADMIN_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          docker compose up --build --wait --wait-timeout 90
          python -c "import os; from examples.week1 import exercise; print(exercise('http://127.0.0.1:8765', os.environ['AGENTSHIELD_ADMIN_KEY']))"
          docker compose down
